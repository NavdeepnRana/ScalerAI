<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PII Shield | Intelligent Redaction</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0fdf4;
            --surface-color: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --accent: #10b981;
            --border-color: #e2e8f0;
            --success: #10b981;
            --error: #ef4444;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(34, 197, 94, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(34, 197, 94, 0.08) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #064e3b 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 550px;
            line-height: 1.6;
            margin: 0 auto;
        }

        .container {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 600px;
            box-shadow: var(--shadow-lg);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }

        .container:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.08);
        }

        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 3.5rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: #f8fafc;
        }

        .upload-area:hover, .upload-area.dragover {
            background: #eff6ff;
            border-color: var(--primary);
        }

        .upload-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
            transition: transform 0.3s ease;
        }
        
        .upload-area:hover .upload-icon {
            transform: scale(1.1);
        }

        .upload-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        input[type="file"] {
            display: none;
        }

        #file-name {
            margin-top: 1.5rem;
            font-weight: 600;
            color: var(--primary);
            text-align: center;
            min-height: 24px;
            font-size: 1.05rem;
        }

        button {
            margin-top: 2rem;
            width: 100%;
            padding: 1.1rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 20px -6px rgba(34, 197, 94, 0.5);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -6px rgba(34, 197, 94, 0.6);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 4px 10px -4px rgba(34, 197, 94, 0.5);
        }

        button:disabled {
            background: #cbd5e1;
            color: #f8fafc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            margin-top: 1.2rem;
            text-align: center;
            font-size: 1rem;
            font-weight: 500;
            min-height: 24px;
        }

        .status.success { color: var(--success); }
        .status.error { color: var(--error); }
        .status.loading { color: var(--primary); animation: pulse 1.5s infinite; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <header>
        <h1>PII Shield</h1>
        <p class="subtitle">Securely sanitize your documents. We automatically detect and replace sensitive information with realistic synthethic data.</p>
    </header>

    <div class="container">
        <form id="upload-form">
            <div class="upload-area" id="drop-zone">
                <div class="upload-icon">📄</div>
                <div class="upload-text">Drag & Drop your file here</div>
                <div class="upload-hint">Supports .PDF, .TXT, and .DOCX (Max 10MB)</div>
                <input type="file" id="file-input" name="document" accept=".pdf, .txt, .docx" required>
            </div>
            <div id="file-name"></div>
            
            <button type="submit" id="submit-btn" disabled>
                <span class="spinner" id="spinner"></span>
                <span id="btn-text">Redact & Download Document</span>
            </button>
            <div id="status-message" class="status"></div>
        </form>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name');
        const submitBtn = document.getElementById('submit-btn');
        const uploadForm = document.getElementById('upload-form');
        const statusMessage = document.getElementById('status-message');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btn-text');

        // Handle Drag & Drop Events
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', handleDrop, false);
        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', handleFiles);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files; // Assign files to input
            handleFiles();
        }

        function handleFiles() {
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fileNameDisplay.textContent = `Selected: ${file.name}`;
                submitBtn.disabled = false;
                statusMessage.textContent = '';
                statusMessage.className = 'status';
            } else {
                fileNameDisplay.textContent = '';
                submitBtn.disabled = true;
            }
        }

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append('document', fileInput.files[0]);

            // UI Loading State
            submitBtn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Processing...';
            statusMessage.textContent = 'Analyzing and redacting PII...';
            statusMessage.className = 'status loading';

            try {
                const response = await fetch('/api/redact', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    // Extract filename from headers if possible, or use default
                    let filename = 'redacted_document.docx';
                    const disposition = response.headers.get('Content-Disposition');
                    if (disposition && disposition.indexOf('attachment') !== -1) {
                        const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                        const matches = filenameRegex.exec(disposition);
                        if (matches != null && matches[1]) { 
                            filename = matches[1].replace(/['"]/g, '');
                        }
                    }

                    // Trigger download
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    
                    statusMessage.textContent = 'Success! Your redacted document has been downloaded.';
                    statusMessage.className = 'status success';
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Server error occurred.');
                }
            } catch (error) {
                console.error(error);
                statusMessage.textContent = `Error: ${error.message}`;
                statusMessage.className = 'status error';
            } finally {
                // Reset UI
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Redact & Download Document';
            }
        });
    </script>
</body>
</html>
